server:
  port: 8080

spring:
  application:
    name: guatequeriders-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/guatequeriders}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:GuatequeRidersDevSecretKeyForJwtSigning2026ChangeMe}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
