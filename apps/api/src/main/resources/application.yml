server:
  port: 8080
  tomcat:
    connection-timeout: 5s

app:
  environment: ${APP_ENV:production}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:60}
    checkout-session-per-minute: ${RATE_LIMIT_CHECKOUT_SESSION_PER_MINUTE:20}
  merch:
    test-payments-enabled: ${MERCH_TEST_PAYMENTS_ENABLED:false}

spring:
  application:
    name: guatequeriders-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/guatequeriders}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

stripe:
  enabled: ${STRIPE_ENABLED:false}
  mode: ${STRIPE_MODE:test}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  public-url: ${APP_PUBLIC_URL:}
