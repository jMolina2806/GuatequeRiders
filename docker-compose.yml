services:
  postgres:
    image: postgres:16-alpine
    container_name: guatequeriders-postgres
    environment:
      POSTGRES_DB: guatequeriders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - guatequeriders-pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: guatequeriders-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  guatequeriders-pgdata:
