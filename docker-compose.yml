services:
  postgres:
    image: postgres:16-alpine
    container_name: guatequeriders-postgres
    environment:
      POSTGRES_DB: guatequeriders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - guatequeriders-pgdata:/var/lib/postgresql/data

volumes:
  guatequeriders-pgdata:
