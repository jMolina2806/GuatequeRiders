name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      UNSUBSCRIBE_SECRET: ci-only-unsubscribe-secret-key-2026-do-not-use
      MAIL_ENABLED: 'false'
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  production-images:
    name: Production images
    runs-on: ubuntu-latest
    env:
      APP_DOMAIN: ci.guatequeriders.example
      POSTGRES_PASSWORD: ci-only-postgres-password
      JWT_SECRET: ci-only-jwt-secret-key-2026-at-least-32-characters
      UNSUBSCRIBE_SECRET: ci-only-unsubscribe-secret-key-2026-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build -t guatequeriders-api:ci apps/api

      - name: Build frontend image
        run: docker build -t guatequeriders-web:ci apps/web

      - name: Validate Caddy configuration
        run: docker run --rm -e APP_DOMAIN=localhost guatequeriders-web:ci caddy validate --config /etc/caddy/Caddyfile

      - name: Validate production Compose configuration
        run: docker compose --env-file /dev/null -f docker-compose.prod.yml config -q
